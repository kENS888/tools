<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>B案 電卓とレシート｜しごと計算ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Share+Tech+Mono&family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="b.css"><script src="../kit.js"></script>
<style>
.hero{margin:24px 0 40px;background:var(--body);border-radius:24px;padding:20px;box-shadow:0 10px 0 #17191d}
.disp{background:var(--lcd);color:var(--lcd-ink);border-radius:12px;padding:28px 24px;box-shadow:inset 0 3px 0 rgba(0,0,0,.18)}
.disp h1{margin:0;font:400 clamp(1.7rem,5.4vw,3.2rem)/1.3 "DotGothic16",sans-serif}
.disp p{margin:10px 0 0;font:400 .95rem "DotGothic16"}
.panel{margin-top:32px}
.panel h2{font-size:1rem;margin:0 0 14px;display:flex;gap:10px;align-items:baseline}
.panel h2 small{font-weight:400;color:var(--sub);font-size:.85rem}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:16px 14px}
.keys a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 8px 16px;text-decoration:none;font-weight:700}
.keys a span[data-i]{width:48px;height:48px;color:var(--c)}
.keys a:hover{background:#fff}
@media (max-width:560px){.keys{grid-template-columns:repeat(3,1fr);gap:12px 10px}.keys a{font-size:.8rem;padding:14px 4px 12px}.keys a span[data-i]{width:36px;height:36px}.hero{padding:12px;border-radius:18px}.disp{padding:20px 16px}}
</style></head><body>
<div class="wrap">
 <div class="bar"><a class="logo" href="./"><i></i>しごと計算ラボ</a></div>
 <section class="hero"><div class="disp"><h1>仕事の書類と計算を、<br>もっと手軽に。</h1><p>むりょう ・ とうろくなし ・ にゅうりょくは このたんまつだけ</p></div></section>
 <section class="panel"><h2>書類をつくる <small>PDFで保存・印刷</small></h2><div class="keys" id="doc"></div></section>
 <section class="panel"><h2>計算する <small>答えがすぐ出る</small></h2><div class="keys" id="calc"></div></section>
 <div class="ad">広告</div>
 <footer><a href="#">プライバシーポリシー</a><a href="#">お問い合わせ</a><a href="../">← 3案の比較へ</a></footer>
</div>
<script>
TOOLS.forEach(function(t){document.getElementById(t.g).insertAdjacentHTML('beforeend','<a class="key" href="'+(t.k==='shohizei'?'shohizei.html':'#')+'" style="--c:'+t.c+'"><span data-i="'+t.k+'"></span>'+t.n+'</a>')});
</script>
</body></html>
