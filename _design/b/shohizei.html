<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>B案 消費税計算｜しごと計算ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Share+Tech+Mono&family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="b.css"><script src="../kit.js"></script>
<style>
.head{display:flex;align-items:center;gap:14px;padding:12px 0 24px}
.head span[data-i]{width:48px;height:48px;color:var(--acc)}
.head h1{margin:0;font-size:1.6rem;font-weight:800;line-height:1.3}
.head p{margin:0;color:var(--sub);font-size:.9rem}
.desk{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
.calc{background:var(--body);border-radius:24px;padding:18px;box-shadow:0 10px 0 #17191d}
.disp{background:var(--lcd);color:var(--lcd-ink);border-radius:12px;padding:14px 18px 10px;box-shadow:inset 0 3px 0 rgba(0,0,0,.18)}
.disp .row{display:flex;justify-content:space-between;align-items:baseline;font:400 .85rem "DotGothic16"}
.disp input{all:unset;width:100%;text-align:right;font:400 1.5rem "Share Tech Mono";border-bottom:1.5px dashed rgba(31,42,23,.35)}
.disp input:focus{border-bottom-style:solid}
.disp .ans{font-size:clamp(3rem,8vw,4.8rem);line-height:1.05;text-align:right;margin-top:6px;white-space:nowrap}
.disp .ans small{font:400 1.2rem "DotGothic16";margin-left:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.pad .wide{grid-column:span 3;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pad .key{padding:12px 4px 10px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:1.1rem}
.pad .key span[data-i]{width:30px;height:30px;color:var(--sub)}
.pad .key small{font-size:.7rem;font-weight:400;color:var(--sub)}
.pad .key[aria-pressed=true]{background:var(--acc);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--acc) 60%,#000)}
.pad .key[aria-pressed=true] span[data-i],.pad .key[aria-pressed=true] small{color:#fff}
.mode .key{font-size:1rem;padding:14px 4px}
.mode .key[aria-pressed=true]{background:var(--body2);color:var(--lcd);box-shadow:inset 0 2px 0 rgba(0,0,0,.4)}
.rcpt{background:var(--paper);color:#20232a;padding:22px 22px 30px;font:400 .95rem/1.9 "DotGothic16",monospace;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.08);--z:linear-gradient(-45deg,var(--desk) 6px,transparent 0),linear-gradient(45deg,var(--desk) 6px,transparent 0)}
.rcpt::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:12px;background:var(--z);background-size:12px 12px;background-position:0 100%}
.rcpt h2{font:400 1rem "DotGothic16";text-align:center;margin:0 0 10px;letter-spacing:.3em}
.rcpt .l{display:flex;justify-content:space-between;gap:8px}
.rcpt .l b{font-weight:400}
.rcpt hr{border:0;border-top:1.5px dashed #9aa0a8;margin:8px 0}
.rcpt .tot{font-size:1.25rem}
.rcpt.print{animation:pr .35s ease-out}
@keyframes pr{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.acts{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.acts .key{padding:12px;font-weight:800;display:flex;justify-content:center;gap:8px;align-items:center;text-decoration:none}
.acts .key span[data-i]{width:22px;height:22px}
.acts .go{background:var(--ink);color:var(--desk);box-shadow:0 4px 0 #000}
.about{margin-top:8px}.about summary{cursor:pointer;font-weight:700}.about p{color:var(--sub);font-size:.9rem;max-width:40em}
@media (max-width:820px){.desk{grid-template-columns:1fr}.calc{padding:12px;border-radius:18px}.head h1{font-size:1.3rem}}
@media (prefers-reduced-motion:reduce){.rcpt.print{animation:none}.key{transition:none}}
</style></head><body>
<div class="wrap">
 <div class="bar"><a class="logo" href="./"><i></i>しごと計算ラボ</a></div>
 <div class="head"><span data-i="shohizei"></span><div><h1>消費税計算</h1><p>金額を打って、税率を押すだけ。</p></div></div>
 <div class="desk">
  <div class="calc">
   <div class="disp" aria-live="polite">
    <div data-show="single"><div class="row"><label for="amt" data-ex="ぜいぬき" data-in="ぜいこみ"></label><span>円</span></div><input id="amt" class="lcdf" inputmode="numeric" value="10,000" autocomplete="off"></div>
    <div data-show="mix" class="two" hidden>
     <div><div class="row"><label for="a10">10%のぶん</label></div><input id="a10" class="lcdf" inputmode="numeric" value="10,000"></div>
     <div><div class="row"><label for="a8">8%のぶん</label></div><input id="a8" class="lcdf" inputmode="numeric" value="5,000"></div>
    </div>
    <div class="ans lcdf"><span id="big"></span><small>円</small></div>
    <div class="row"><span data-ex="＝ ぜいこみ" data-in="＝ ぜいぬき"></span><span>しょうひぜい <span class="lcdf" id="tx"></span> 円</span></div>
   </div>
   <div class="pad">
    <div class="wide mode"><button class="key" data-mode="ex" aria-pressed="true">税抜 → 税込</button><button class="key" data-mode="in" aria-pressed="false">税込 → 税抜</button></div>
    <button class="key" data-rate="10" aria-pressed="true"><span data-i="bag"></span>10%<small>ふつう</small></button>
    <button class="key" data-rate="8" aria-pressed="false"><span data-i="food"></span>8%<small>食べ物・新聞</small></button>
    <button class="key" data-rate="mix" aria-pressed="false"><span data-i="mix"></span>両方<small>まざっている</small></button>
   </div>
  </div>
  <div>
   <div class="rcpt" id="rc"><h2>計算結果</h2><div id="lines"></div></div>
   <div class="acts"><button class="key"><span data-i="ryoshusho"></span>結果をコピー</button><a class="key go" href="#"><span data-i="seikyusho"></span>この金額で請求書を作る</a></div>
  </div>
 </div>
 <div class="ad">広告</div>
 <details class="about"><summary>消費税計算ツールでできること・よくある質問</summary><p>(本番では、検索とAI向けの説明・よくある質問・早見表をここに静的HTMLで置きます。)</p></details>
 <footer><a href="./">トップ</a><a href="#">プライバシーポリシー</a><a href="#">お問い合わせ</a><a href="../">← 3案の比較へ</a></footer>
</div>
<script>
var first=1;
Calc.init(function(r){var f=Calc.f,h='';
 document.getElementById('big').textContent=f(r.mode==='ex'?r.inc:r.ex);document.getElementById('tx').textContent=f(r.tax);
 r.parts.forEach(function(p){h+='<div class="l"><b>税抜('+p.r+'%)</b><span>¥'+f(p.ex)+'</span></div><div class="l"><b>　消費税</b><span>¥'+f(p.tax)+'</span></div>'});
 h+='<hr><div class="l tot"><b>税込 合計</b><span>¥'+f(r.inc)+'</span></div>';
 var rc=document.getElementById('rc');document.getElementById('lines').innerHTML=h;
 var k=r.mode+r.rate;if(first!==1&&first!==k){rc.classList.remove('print');void rc.offsetWidth;rc.classList.add('print')}first=k;
});
</script>
</body></html>
