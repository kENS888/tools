<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>A案 消費税計算｜しごと計算ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="a.css"><script src="../kit.js"></script>
<style>
.head{display:flex;align-items:center;gap:16px;padding:24px 0 28px}
.head span[data-i]{width:56px;height:56px;color:var(--acc);flex:none}
.head h1{margin:0;font-size:1.7rem;font-weight:900;line-height:1.3}
.head p{margin:2px 0 0;color:var(--sub);font-size:.9rem}
.sheet{background:var(--white);border:1.5px solid var(--ink);display:grid;grid-template-columns:5fr 6fr}
.in{padding:28px;border-right:1.5px solid var(--ink)}
.out{padding:28px;display:flex;flex-direction:column;justify-content:center}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink)}
.seg button{all:unset;cursor:pointer;text-align:center;padding:10px 4px;font-weight:700;font-size:.95rem}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--white)}
.lab{display:block;font-weight:700;font-size:.85rem;color:var(--sub);margin:24px 0 4px}
.yen{display:flex;align-items:baseline;border-bottom:2.5px solid var(--ink)}
.yen input{all:unset;width:100%;min-width:0;font-family:"Barlow Condensed";font-size:3rem;font-weight:600;line-height:1.2;text-align:right}
.yen b{font-size:1.1rem;margin-left:6px}
.yen:focus-within{border-color:var(--acc)}
.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rates button{all:unset;cursor:pointer;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px 10px;font-weight:700;font-size:1.25rem;line-height:1;font-family:"Barlow Condensed"}
.rates button span[data-i]{width:30px;height:30px;color:var(--sub)}
.rates button small{font:400 .72rem "Zen Kaku Gothic New";color:var(--sub)}
.rates button[aria-pressed=true]{border-color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc);color:var(--acc)}
.rates button[aria-pressed=true] span[data-i]{color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two .yen input{font-size:2.2rem}
.cap{font-size:.95rem;color:var(--sub);font-weight:700}
.ans{font-size:clamp(4rem,9vw,6.5rem);font-weight:600;line-height:1;color:var(--acc);margin:6px 0 0;white-space:nowrap}
.ans b{font:700 1.6rem "Zen Kaku Gothic New";margin-left:6px}
.stack{display:flex;height:56px;margin-top:28px;border:1.5px solid var(--ink)}
.stack div{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;min-width:0;overflow:hidden;white-space:nowrap;transition:flex-grow .35s ease}
.stack .e{background:repeating-linear-gradient(90deg,transparent 0 23px,var(--grid) 23px 24px)}
.stack .t{background:var(--acc);color:#fff;border-left:1.5px solid var(--ink);min-width:72px}
.legend{display:flex;justify-content:space-between;margin-top:8px;font-size:.9rem}
.legend .num{font-size:1.4rem;font-weight:600}
.acts{display:flex;gap:8px;margin-top:24px;flex-wrap:wrap}
.acts button,.acts a{all:unset;cursor:pointer;border:1.5px solid var(--ink);padding:8px 14px;font-weight:700;font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.acts a{background:var(--ink);color:var(--white)}
.acts span[data-i]{width:20px;height:20px}
.about{margin-top:8px;border-top:1.5px solid var(--ink);padding-top:16px}
.about summary{cursor:pointer;font-weight:700}
.about p{color:var(--sub);font-size:.9rem;max-width:40em}
@media (max-width:760px){.sheet{grid-template-columns:1fr}.in{border-right:0;border-bottom:1.5px solid var(--ink)}.in,.out{padding:20px}.head h1{font-size:1.35rem}.head span[data-i]{width:44px;height:44px}}
@media (prefers-reduced-motion:reduce){.stack div{transition:none}}
</style></head><body>
<div class="wrap">
 <div class="bar"><a class="logo" href="./"><i></i>しごと計算ラボ</a></div>
 <div class="head"><span data-i="shohizei"></span><div><h1>消費税計算</h1><p>金額を入れるだけ。税込も税抜もすぐ分かる。</p></div></div>
 <div class="sheet">
  <div class="in">
   <div class="seg"><button data-mode="ex" aria-pressed="true">税抜 → 税込</button><button data-mode="in" aria-pressed="false">税込 → 税抜</button></div>
   <div data-show="single"><label class="lab" for="amt" data-ex="税抜の金額" data-in="税込の金額"></label><div class="yen"><input id="amt" inputmode="numeric" value="10,000" autocomplete="off"><b>円</b></div></div>
   <div data-show="mix" class="two" hidden>
    <div><label class="lab" for="a10">10%の分</label><div class="yen"><input id="a10" inputmode="numeric" value="10,000"><b>円</b></div></div>
    <div><label class="lab" for="a8">8%の分</label><div class="yen"><input id="a8" inputmode="numeric" value="5,000"><b>円</b></div></div>
   </div>
   <span class="lab">税率</span>
   <div class="rates">
    <button data-rate="10" aria-pressed="true"><span data-i="bag"></span>10%<small>ふつう</small></button>
    <button data-rate="8" aria-pressed="false"><span data-i="food"></span>8%<small>食べ物・新聞</small></button>
    <button data-rate="mix" aria-pressed="false"><span data-i="mix"></span>両方<small>まざっている</small></button>
   </div>
  </div>
  <div class="out" aria-live="polite">
   <div class="cap" data-ex="税込はいくら？" data-in="税抜はいくら？"></div>
   <div class="ans num"><span id="big"></span><b>円</b></div>
   <div class="stack"><div class="e" id="be">税抜</div><div class="t" id="bt">消費税</div></div>
   <div class="legend"><span>税抜 <span class="num" id="le"></span> 円</span><span>消費税 <span class="num" id="lt"></span> 円</span></div>
   <div class="acts"><button><span data-i="ryoshusho"></span>コピー</button><a href="#"><span data-i="seikyusho"></span>この金額で請求書へ</a></div>
  </div>
 </div>
 <div class="ad">広告</div>
 <details class="about"><summary>消費税計算ツールでできること・よくある質問</summary><p>(本番では、検索とAI向けの説明・よくある質問・早見表をここに静的HTMLで置きます。開かなくても読み込まれるので、検索には影響しません。)</p></details>
 <footer><a href="./">トップ</a><a href="#">プライバシーポリシー</a><a href="#">お問い合わせ</a><a href="../">← 3案の比較へ</a></footer>
</div>
<script>
Calc.init(function(r){var f=Calc.f;
 document.getElementById('big').textContent=f(r.mode==='ex'?r.inc:r.ex);
 document.getElementById('le').textContent=f(r.ex);document.getElementById('lt').textContent=f(r.tax);
 document.getElementById('be').style.flexGrow=r.ex||1;document.getElementById('bt').style.flexGrow=r.tax;
});
</script>
</body></html>
