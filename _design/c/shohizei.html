<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>C案 消費税計算｜しごと計算ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="c.css"><script src="../kit.js"></script>
<style>
.band{background:var(--acc);color:#fff}
.band .wrap{display:flex;align-items:center;gap:20px;padding-top:28px;padding-bottom:28px}
.band span[data-i]{width:72px;height:72px;flex:none}
.band h1{margin:0;font-size:2rem;line-height:1.25}
.band p{margin:2px 0 0;opacity:.9}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;margin-top:36px;border:3px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:10px 22px;font-weight:700}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.eq{display:grid;grid-template-columns:auto auto auto auto auto;align-items:end;justify-content:start;gap:0 18px;margin-top:40px;font-variant-numeric:tabular-nums}
.eq .t{grid-row:1;font-size:.9rem;color:var(--sub);font-weight:700;margin-bottom:6px}
.eq .v{grid-row:2;font-size:clamp(2.2rem,6vw,4.4rem);font-weight:700;line-height:1;white-space:nowrap;letter-spacing:-.02em}
.eq .op{grid-row:2;font-size:clamp(1.6rem,4vw,3rem);color:var(--sub);line-height:1}
.eq input{all:unset;width:6.2ch;border-bottom:4px solid var(--ink);font:inherit}
.eq input:focus{border-color:var(--acc)}
.eq .res{color:var(--acc)}
.eq.e3{grid-template-columns:auto auto auto}
.eq small{font-size:.4em;margin-left:2px;font-weight:700}
.mixin{display:flex;gap:28px;flex-wrap:wrap;margin-top:32px}
.mixin label{display:block;font-weight:700;color:var(--sub);font-size:.9rem}
.mixin input{all:unset;width:7ch;font-size:2.2rem;font-weight:700;border-bottom:4px solid var(--ink);font-variant-numeric:tabular-nums}
.mixin input:focus{border-color:var(--acc)}
.rates{display:flex;gap:16px;margin-top:40px;flex-wrap:wrap}
.rates button{all:unset;cursor:pointer;width:132px;text-align:center;font-weight:700}
.rates .p{display:flex;align-items:center;justify-content:center;aspect-ratio:1.25;border:3px solid var(--ink);border-radius:14px;margin-bottom:8px;flex-direction:column;gap:4px;font-size:1.5rem}
.rates .p span{width:40px;height:40px}
.rates small{display:block;font-weight:400;color:var(--sub);font-size:.8rem}
.rates button[aria-pressed=true] .p{background:var(--acc);border-color:var(--acc);color:#fff}
.acts{display:flex;gap:12px;margin-top:44px;flex-wrap:wrap}
.acts button,.acts a{all:unset;cursor:pointer;border:3px solid var(--ink);border-radius:999px;padding:10px 20px;font-weight:700;display:inline-flex;gap:8px;align-items:center}
.acts a{background:var(--ink);color:var(--bg)}
.acts span[data-i]{width:22px;height:22px}
.about summary{cursor:pointer;font-weight:700}.about p{color:var(--sub);font-size:.9rem;max-width:40em}
@media (max-width:640px){
 .band span[data-i]{width:52px;height:52px}.band h1{font-size:1.5rem}
 .eq,.eq.e3{grid-template-columns:auto 1fr;gap:0 16px}
 .eq .t,.eq .v{grid-row:auto}
 .eq .op,.eq .sp{display:none}
 .t.c1{order:1}.v.c1{order:2}.t.c2{order:3}.v.c2{order:4}.t.c3{order:5}.v.c3{order:6}
 .eq .v{font-size:2.6rem;margin-bottom:14px}.eq .t{align-self:center;margin:0 0 14px}
 .rates{gap:10px}.rates button{width:calc((100% - 20px)/3)}.rates .p{font-size:1.2rem}
}
</style></head><body>
<header class="band"><div class="wrap"><span data-i="shohizei"></span><div><h1>消費税計算</h1><p>金額を入れるだけ</p></div></div></header>
<div class="wrap">
 <div class="seg"><button data-mode="ex" aria-pressed="true">税抜 → 税込</button><button data-mode="in" aria-pressed="false">税込 → 税抜</button></div>
 <div class="eq" aria-live="polite" id="eq" data-show="single">
  <div class="t c1" data-ex="税抜" data-in="税込"></div><div class="t sp"></div><div class="t c2">消費税</div><div class="t sp"></div><div class="t c3" data-ex="税込" data-in="税抜"></div>
  <div class="v c1"><input id="amt" inputmode="numeric" value="10,000" aria-label="金額"><small>円</small></div><div class="op" id="opx">＋</div><div class="v c2" id="tx"></div><div class="op">＝</div><div class="v res c3" id="big"></div>
 </div>
 <div data-show="mix" hidden>
  <div class="mixin"><div><label for="a10">10%の分</label><input id="a10" inputmode="numeric" value="10,000"></div><div><label for="a8">8%の分</label><input id="a8" inputmode="numeric" value="5,000"></div></div>
  <div class="eq e3"><div class="t c1">消費税</div><div class="t sp"></div><div class="t c2" data-ex="税込 合計" data-in="税抜 合計"></div><div class="v c1" id="tx2"></div><div class="op">→</div><div class="v res c2" id="big2"></div></div>
 </div>
 <div class="rates">
  <button data-rate="10" aria-pressed="true"><div class="p"><span data-i="bag"></span>10%</div>ふつう</button>
  <button data-rate="8" aria-pressed="false"><div class="p"><span data-i="food"></span>8%</div>食べ物・新聞</button>
  <button data-rate="mix" aria-pressed="false"><div class="p"><span data-i="mix"></span>両方</div>まざっている</button>
 </div>
 <div class="acts"><button><span data-i="ryoshusho"></span>コピー</button><a href="#"><span data-i="seikyusho"></span>この金額で請求書を作る</a></div>
 <div class="ad">広告</div>
 <details class="about"><summary>消費税計算ツールでできること・よくある質問</summary><p>(本番では、検索とAI向けの説明・よくある質問・早見表をここに静的HTMLで置きます。)</p></details>
 <footer style="margin-top:40px"><a href="./">トップ</a><a href="#">プライバシーポリシー</a><a href="#">お問い合わせ</a><a href="../">← 3案の比較へ</a></footer>
</div>
<script>
Calc.init(function(r){var f=Calc.f,y='<small>円</small>',a=document.getElementById('amt');a.style.width=Math.max(2,a.value.length*.6+.2)+'em';
 document.getElementById('opx').textContent=r.mode==='ex'?'＋':'−';
 document.getElementById('tx').innerHTML=f(r.tax)+y;document.getElementById('big').innerHTML=f(r.mode==='ex'?r.inc:r.ex)+y;
 document.getElementById('tx2').innerHTML=f(r.tax)+y;document.getElementById('big2').innerHTML=f(r.mode==='ex'?r.inc:r.ex)+y;
});
</script>
</body></html>
