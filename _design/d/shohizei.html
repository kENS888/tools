<html lang="ja"><head>

<title>D案 消費税計算(レジ)｜しごと計算ラボ</title>

<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Barlow+Condensed:wght@500;600&family=DotGothic16&display=swap" rel="stylesheet">

<style>
.head{display:flex;align-items:center;gap:16px;padding:28px 0 24px}
.head>span{width:52px;height:52px;color:var(--acc);flex:none}
.head h1{margin:0;font-size:1.7rem;line-height:1.3}
.head p{margin:2px 0 0;color:var(--sub);font-size:.92rem}
.sheet{background:var(--sheet);border:1.5px solid var(--ink);display:grid;grid-template-columns:minmax(0,11fr) minmax(0,9fr)}
.reg{padding:24px;border-right:1.5px solid var(--ink)}
.side{padding:24px;background:var(--soft);display:flex;flex-direction:column}
/* お客様表示(ディスプレイ) */
.disp{background:#15191d;color:#f4f7f5;border-radius:10px;padding:14px 18px 16px}
.disp .cl{color:#a9b3ac;font-size:.8rem}
.disp .cur{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:2.4rem}
.disp .cur>span{white-space:nowrap}
.disp #nm{all:unset;flex:1;min-width:0;width:0;font-size:1rem;color:#fff;border-bottom:1px dashed #4a535a;padding:2px 0}
.disp #nm::placeholder{color:#6b756e}
.disp #nm:focus{border-bottom:1px solid #e879f9}
.disp .cur b{font:600 1.7rem "Barlow Condensed";color:#fff;letter-spacing:.01em}
.disp .cur b.ph{color:#59625c}
.disp .cur i{font-style:normal;display:inline-block;width:2px;height:1.3rem;background:#e879f9;margin-left:3px;vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.disp .tot{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid #2f363c;margin-top:8px;padding-top:6px}
.disp .tot>span{font-size:.95rem;font-weight:700;padding-bottom:.7rem}
.disp .big{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:clamp(3.4rem,7vw,5rem);line-height:1;white-space:nowrap}
.disp .big small{font:700 1.2rem "BIZ UDPGothic";margin-left:4px}
.disp .tx{text-align:right;color:#a9b3ac;font-size:.88rem}
.disp .tx b{font:600 1.15rem "Barlow Condensed";color:#fff}
/* 税抜で打つ／税込で打つ */
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);margin:16px 0 14px}
.seg button{all:unset;cursor:pointer;text-align:center;padding:9px 4px;font-weight:700;font-size:.92rem}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--sheet)}
/* テンキー */
.pad{display:grid;grid-template-columns:repeat(3,1fr) 1.25fr;gap:8px}
.k{all:unset;box-sizing:border-box;min-width:0;cursor:pointer;user-select:none;-webkit-user-select:none;text-align:center;border:1.5px solid var(--line);background:var(--sheet);border-radius:8px;height:56px;display:flex;align-items:center;justify-content:center;font:600 1.6rem "Barlow Condensed";box-shadow:0 2px 0 var(--line);transition:transform .05s,box-shadow .05s}
.k:active,.k.hit{transform:translateY(2px);box-shadow:0 0 0 var(--line)}
.k.bs{font-size:1.1rem}
.k.r{flex-direction:column;gap:1px;line-height:1;font-size:1.3rem;border-color:var(--ink);height:64px}
.k.r span[data-i]{width:18px;height:18px;color:var(--sub)}
.k.r small{font:400 .66rem "BIZ UDPGothic";color:var(--sub)}
.k.r[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 2px 0 color-mix(in srgb,var(--acc) 55%,#000)}
.k.r[aria-pressed=true] span[data-i],.k.r[aria-pressed=true] small{color:#fff}
.k.nx{background:var(--ink);color:var(--sheet);border-color:var(--ink);font:700 .95rem/1.4 "BIZ UDPGothic";flex-direction:column;box-shadow:0 2px 0 #000}
.k.nx b{font:600 1.5rem/1 "Barlow Condensed"}
.k.mul{font-size:1.7rem;color:var(--sub)}
.k.mul.on{border-color:var(--acc);color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
.rcpt .l .at{font-size:.78rem;color:#7a7f86;white-space:nowrap}
.k.nx:disabled{opacity:.35;cursor:default}
/* レシート */
.rcpt{background:var(--paper);color:#22262b;padding:20px 20px 26px;font:400 .95rem/1.85 "DotGothic16",monospace;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.08);--z:linear-gradient(-45deg,var(--soft) 6px,transparent 0),linear-gradient(45deg,var(--soft) 6px,transparent 0)}
.rcpt::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:12px;background:var(--z);background-size:12px 12px;background-position:0 100%}
.rcpt .t{text-align:center;letter-spacing:.25em;margin:0}
.rcpt .d{text-align:center;font-size:.8rem;color:#6b7078;margin:0 0 6px}
.rcpt .l{display:flex;justify-content:space-between;gap:8px;align-items:center}
.rcpt .l.p{color:#8a8f96}
.rcpt .l .x{all:unset;cursor:pointer;color:#a0a5ab;width:20px;text-align:center;font-family:system-ui;font-size:.9rem}
.rcpt .l .x:hover{color:#c2410c}
.rcpt .l .n{flex:none;width:3.2em}
.rcpt .l .nmi{all:unset;flex:1;min-width:0;font:inherit;color:#22262b;border-bottom:1px dashed transparent;overflow:hidden;text-overflow:ellipsis}
.rcpt .l .nmi::placeholder{color:#b3b7bc}
.rcpt .l .nmi:hover,.rcpt .l .nmi:focus{border-bottom-color:#a3a8ae}
.rcpt .l .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcpt .l.sub{font-size:.85rem;color:#4b5058}
.rcpt hr{border:0;border-top:1.5px dashed #a3a8ae;margin:6px 0}
.rcpt .tt{font-size:1.25rem}
.rcpt .nt{font-size:.75rem;color:#6b7078;margin-top:4px}
.rcpt .new{animation:pr .3s ease-out}
@keyframes pr{from{opacity:0;transform:translateY(-6px)}}
/* ゲージ */
.gauge{display:flex;height:40px;margin-top:22px;border:1.5px solid var(--ink);background:var(--sheet)}
.gauge div{display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;white-space:nowrap;overflow:hidden;transition:flex-grow .35s ease}
.gauge .e{color:var(--sub)}
.gauge .t10{background:var(--acc);color:#fff;border-left:1.5px solid var(--ink);min-width:54px}
.gauge .t8{background:repeating-linear-gradient(-45deg,var(--acc) 0 5px,color-mix(in srgb,var(--acc) 70%,#fff) 5px 10px);color:#fff;border-left:1.5px solid var(--ink);min-width:54px}
.glg{display:flex;justify-content:space-between;font-size:.8rem;color:var(--sub);margin-top:6px}
.acts{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.acts button,.acts a{all:unset;cursor:pointer;border:1.5px solid var(--ink);background:var(--sheet);padding:8px 14px;font-weight:700;font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.acts a{background:var(--ink);color:var(--sheet)}
.acts span[data-i]{width:20px;height:20px}
.acts .clr{margin-left:auto;border-color:transparent;background:none;color:var(--sub);font-weight:400;padding:8px 4px}
.about{margin-top:8px}.about summary{cursor:pointer;font-weight:700}.about p{color:var(--sub);font-size:.9rem;max-width:40em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-color-scheme:dark){.disp{border:1px solid #2f363c}.k.r[aria-pressed=true],.k.r[aria-pressed=true] span[data-i],.k.r[aria-pressed=true] small{color:#2e0533}}
@media (max-width:820px){.sheet{grid-template-columns:minmax(0,1fr)}.reg{border-right:0;border-bottom:1.5px solid var(--ink)}.reg,.side{padding:16px}.head h1{font-size:1.35rem}.head>span{width:42px;height:42px}.k{height:52px}}
@media (prefers-reduced-motion:reduce){.disp .cur i,.rcpt .new{animation:none}.gauge div{transition:none}}
</style></head><body>
<div class="wrap">
 <div class="bar"><a class="logo" href="./"><i></i>しごと計算ラボ</a></div>
 <div class="head"><span data-i="shohizei"></span><div><h1>消費税計算</h1><p>レジのように打つだけ。10%と8%がまざっていてもOK。</p></div></div>

 <div class="sheet">
  <div class="reg">
   <div class="disp" aria-live="polite">
    <div class="cl" id="curL"></div>
    <div class="cur"><input id="nm" autocomplete="off" placeholder="品名(なくてもOK)" aria-label="品名"><span><b id="curV" class="num"></b><i aria-hidden="true"></i></span></div>
    <div class="tot"><span id="totL"></span><div class="big"><span id="big"></span><small>円</small></div></div>
    <div class="tx">消費税 <b id="txV"></b> 円</div>
   </div>
   <div class="seg" role="group" aria-label="打つ金額"><button data-m="ex" aria-pressed="true">税抜で打つ</button><button data-m="in" aria-pressed="false">税込で打つ</button></div>
   <div class="pad" id="pad">
    <button class="k" data-k="7">7</button><button class="k" data-k="8">8</button><button class="k" data-k="9">9</button>
    <button class="k r" data-r="10" aria-pressed="true"><span data-i="bag"></span>10%<small>ふつう</small></button>
    <button class="k" data-k="4">4</button><button class="k" data-k="5">5</button><button class="k" data-k="6">6</button>
    <button class="k r" data-r="8" aria-pressed="false"><span data-i="food"></span>8%<small>食べ物・新聞</small></button>
    <button class="k" data-k="1">1</button><button class="k" data-k="2">2</button><button class="k" data-k="3">3</button>
    <button class="k mul" data-k="x" aria-label="個数をかける(例：3 × 500円)">×</button>
    <button class="k" data-k="0">0</button><button class="k" data-k="00">00</button><button class="k bs" data-k="bs" aria-label="1文字消す">⌫</button>
    <button class="k nx" id="nx" aria-label="次の金額を打つ"><b>＋</b>次の金額</button>
   </div>
  </div>
  <div class="side">
   <div class="rcpt"><p class="t">レシート</p><p class="d" id="dt"></p><div id="lines"></div></div>
   <div class="gauge" aria-hidden="true"><div class="e" id="gE">税抜</div><div class="t10" id="g10">10%</div><div class="t8" id="g8">8%</div></div>
   <div class="glg"><span>税抜の金額</span><span>消費税</span></div>
   <div class="acts"><button id="cp"><span data-i="ryoshusho"></span>コピー</button><a href="/seikyusho/" id="inv"><span data-i="seikyusho"></span>この内容で請求書を作る</a><button class="clr" id="clr">ぜんぶ消す</button></div>
  </div>
 </div>
 <div class="ad">広告</div>
 <details class="about"><summary>消費税計算ツールでできること・よくある質問</summary><p>(本番では、検索とAI向けの説明・よくある質問・早見表をここに静的HTMLで置きます。端数処理の切り替えも、ここの「くわしく見る」に入れます。)</p></details>

</div>

<script id="core">
/* 税率ごとに合計してから消費税を出す(インボイスの端数処理：税率ごとに1回) */
function regCalc(lines,mode){
 var g={10:0,8:0};lines.forEach(function(l){if(l.a>0)g[l.r]+=l.a});
 var out={groups:[],ex:0,tax:0,inc:0};
 [10,8].forEach(function(r){var s=g[r];if(!s)return;var t,e,i;
  if(mode==='ex'){e=s;t=Math.floor(s*r/100);i=e+t}else{i=s;t=Math.floor(s*r/(100+r));e=i-t}
  out.groups.push({r:r,base:s,ex:e,tax:t,inc:i});out.ex+=e;out.tax+=t;out.inc+=i});
 return out;
}
if(typeof module!=='undefined')module.exports={regCalc:regCalc};
</script>
<script>
(function(){
var $=function(i){return document.getElementById(i)},f=function(v){return v.toLocaleString('ja-JP')};
var st={mode:'ex',lines:[],cur:{a:'10000',q:1,r:10,n:''}},justAdded=false;
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var dd=new Date();$('dt').textContent=dd.getFullYear()+'年'+(dd.getMonth()+1)+'月'+dd.getDate()+'日';
function L(u,q,r,n){return{u:u,q:q,a:u*q,r:r,n:n}}
function all(){var a=st.lines.map(function(l){return L(l.u,l.q,l.r,l.n)});if(+st.cur.a>0)a.push(L(+st.cur.a,st.cur.q,st.cur.r,st.cur.n));return a}
function at(u,q){return q>1?'<span class="at">@'+f(u)+'×'+q+'</span>':''}
function render(){
 var ex=st.mode==='ex',res=regCalc(all(),st.mode),h='',n=0;
 $('curL').textContent=(ex?'税抜':'税込')+'　'+st.cur.r+'%';
 var cv=$('curV'),qs=st.cur.q>1?st.cur.q+' × ':'';cv.textContent=qs+(st.cur.a?f(+st.cur.a):(qs?'1つの金額':'金額を打つ'));cv.classList.toggle('ph',!st.cur.a&&!qs);
 document.querySelector('.k.mul').classList.toggle('on',st.cur.q>1);
 $('totL').textContent=ex?'税込 合計':'税抜 合計';
 $('big').textContent=f(ex?res.inc:res.ex);$('txV').textContent=f(res.tax);
 st.lines.forEach(function(l,i){n++;h+='<div class="l'+(justAdded&&i===st.lines.length-1?' new':'')+'"><span class="n">'+n+'　'+(l.r===8?'※':'　')+'</span><input class="nmi" data-nm="'+i+'" value="'+esc(l.n||'')+'" placeholder="品名なし" aria-label="'+n+'行目の品名">'+at(l.u,l.q)+'<span>¥'+f(l.u*l.q)+'</span><button class="x" data-del="'+i+'" aria-label="'+n+'行目を消す">×</button></div>'});
 if(+st.cur.a>0){n++;h+='<div class="l p"><span class="n">'+n+'　'+(st.cur.r===8?'※':'　')+'</span><span class="pn">'+esc(st.cur.n)+'</span>'+at(+st.cur.a,st.cur.q)+'<span>¥'+f(+st.cur.a*st.cur.q)+'</span><span class="x"></span></div>'}
 if(!n)h+='<div class="l p"><span class="n">まだありません</span></div>';
 h+='<hr>';
 res.groups.forEach(function(g){h+='<div class="l sub"><span>'+g.r+'%対象('+(ex?'税抜':'税込')+')</span><span>¥'+f(g.base)+'</span></div><div class="l sub"><span>　'+(ex?'消費税':'内消費税')+'</span><span>¥'+f(g.tax)+'</span></div>'});
 if(res.groups.length)h+='<hr>';
 h+='<div class="l tt"><span>合計(税込)</span><span>¥'+f(res.inc)+'</span></div><div class="l sub"><span>うち消費税</span><span>¥'+f(res.tax)+'</span></div>';
 if(res.groups.some(function(g){return g.r===8}))h+='<div class="nt">※は軽減税率(8%)の対象</div>';
 $('lines').innerHTML=h;justAdded=false;
 var t10=0,t8=0;res.groups.forEach(function(g){if(g.r===10)t10=g.tax;else t8=g.tax});
 $('gE').style.flexGrow=res.ex||1;$('g10').style.flexGrow=t10;$('g8').style.flexGrow=t8;$('g10').hidden=!t10;$('g8').hidden=!t8;
 document.querySelectorAll('[data-r]').forEach(function(b){b.setAttribute('aria-pressed',+b.dataset.r===st.cur.r)});
 document.querySelectorAll('[data-m]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.m===st.mode)});
 $('nx').disabled=!(+st.cur.a>0);
}
function key(k){
 if(k==='x'){if(st.cur.q===1&&+st.cur.a>1&&+st.cur.a<10000){st.cur.q=+st.cur.a;st.cur.a=''}}
 else if(k==='bs'){if(!st.cur.a&&st.cur.q>1){st.cur.a=String(st.cur.q);st.cur.q=1}else st.cur.a=st.cur.a.slice(0,-1)}
 else if(st.cur.a.length<10){st.cur.a=(st.cur.a+k).replace(/^0+/,'');}
 render();
}
function next(){if(+st.cur.a>0){st.lines.push({u:+st.cur.a,q:st.cur.q,r:st.cur.r,n:st.cur.n.trim()});st.cur={a:'',q:1,r:st.cur.r,n:''};$('nm').value='';justAdded=true;render()}}
$('pad').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 if(b.dataset.k)key(b.dataset.k);else if(b.dataset.r){st.cur.r=+b.dataset.r;render()}else if(b.id==='nx')next();});
document.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){st.mode=b.dataset.m;render()}});
$('lines').addEventListener('click',function(e){var b=e.target.closest('[data-del]');if(b){st.lines.splice(+b.dataset.del,1);render()}});
$('clr').onclick=function(){st.lines=[];st.cur={a:'',q:1,r:st.cur.r,n:''};$('nm').value='';render()};
$('nm').addEventListener('input',function(){st.cur.n=this.value;render()});
$('lines').addEventListener('input',function(e){var i=e.target.dataset.nm;if(i!=null)st.lines[+i].n=e.target.value.trim()});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.target.blur();e.preventDefault()}});
$('inv').onclick=function(e){var a=all();if(!a.length)return;e.preventDefault();
 var doc={incl:st.mode==='in',rnd:'floor',rows:a.map(function(l){return{n:l.n||'',q:String(l.q),u:l.q>1?'個':'式',p:String(l.u),r:String(l.r),xr:'',nw:false}})};
 try{sessionStorage.setItem('shorui_v1',JSON.stringify({doc:doc,me:{}}))}catch(_){}location.href='/seikyusho/'};
function flash(sel){var b=document.querySelector(sel);if(b){b.classList.add('hit');setTimeout(function(){b.classList.remove('hit')},90)}}
document.addEventListener('keydown',function(e){
 if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
 if(/^[0-9]$/.test(e.key)){key(e.key);flash('[data-k="'+e.key+'"]');e.preventDefault()}
 else if(e.key==='Backspace'){key('bs');flash('[data-k=bs]');e.preventDefault()}
 else if(e.key==='Enter'||e.key==='+'){if(e.target.tagName==='BUTTON'&&e.key==='Enter')return;next();flash('#nx');e.preventDefault()}
 else if(e.key==='*'||e.key==='x'||e.key==='X'){key('x');flash('[data-k=x]');e.preventDefault()}
 else if(e.key==='Escape'){st.cur.a='';st.cur.q=1;render()}
});
$('cp').onclick=function(){var r=regCalc(all(),st.mode),t=all().map(function(l){return (l.n||'品名なし')+' '+(l.q>1?f(l.u)+'円×'+l.q+'＝':'')+f(l.a)+'円('+l.r+'%)'}).join('\n')+'\n税抜 '+f(r.ex)+'円 / 消費税 '+f(r.tax)+'円 / 税込 '+f(r.inc)+'円';try{navigator.clipboard.writeText(t)}catch(e){}};
render();
})();
</script>
</body></html>
