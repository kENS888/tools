<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>D案｜しごと計算ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="d.css"><script src="../kit.js"></script>
<style>
.hero{padding:64px 0 48px}
.hero h1{font-size:clamp(2.2rem,7vw,4.6rem);line-height:1.18;margin:0;font-weight:700;letter-spacing:-.02em}
.hero p{margin:18px 0 0;color:var(--sub)}
.grp{margin-top:40px;padding-top:16px;border-top:1.5px solid var(--ink)}
.grp h2{font-size:1.05rem;margin:0 0 18px}
.signs{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:26px 18px}
.signs a{text-decoration:none;font-weight:700;display:block}
.signs .sq{display:flex;align-items:center;justify-content:center;aspect-ratio:1;background:var(--c);color:#fff;border-radius:12px;margin-bottom:10px}
.signs .sq span{width:52%;height:52%}
.signs a:hover .sq{outline:3px solid var(--ink);outline-offset:3px}
@media (max-width:560px){.signs{grid-template-columns:repeat(3,1fr);gap:20px 12px}.signs a{font-size:.85rem}.signs .sq{border-radius:10px;margin-bottom:6px}.hero{padding:40px 0 32px}}
</style></head><body>
<div class="wrap">
 <div class="bar"><a class="logo" href="./"><i></i>しごと計算ラボ</a></div>
 <section class="hero"><h1>仕事の書類と計算を、<br>もっと手軽に。</h1><p>無料・登録なし。入力はこの端末の中だけ。</p></section>
 <section class="grp"><h2>書類をつくる</h2><div class="signs" id="doc"></div></section>
 <section class="grp"><h2>計算する</h2><div class="signs" id="calc"></div></section>
 <div class="ad">広告</div>
 <footer><a href="#">プライバシーポリシー</a><a href="#">お問い合わせ</a><a href="../">← 見本一覧へ</a></footer>
</div>
<script>
TOOLS.forEach(function(t){document.getElementById(t.g).insertAdjacentHTML('beforeend','<a href="'+(t.k==='shohizei'?'shohizei.html':'#')+'" style="--c:'+t.c+'"><div class="sq"><span data-i="'+t.k+'"></span></div>'+t.n+'</a>')});
</script>
</body></html>
